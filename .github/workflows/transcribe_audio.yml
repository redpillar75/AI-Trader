name: Transcribe Audio

on:
  push:
    branches: ['claude/install-agent-skills-xpmqI']

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check if transcript already exists
        id: check
        run: |
          if [ -f "transcript.txt" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        if: steps.check.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: |
          pip install openai-whisper
          sudo apt-get install -y ffmpeg

      - name: Transcribe audio
        if: steps.check.outputs.skip == 'false'
        run: |
          whisper audio_temp_transcribe.mp3 --model small --language en --output_format txt --output_dir /tmp/
          cp /tmp/audio_temp_transcribe.txt transcript.txt

      - name: Commit transcript
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add transcript.txt
          git diff --staged --quiet || git commit -m "feat: add audio transcript [skip ci]"
          git push
